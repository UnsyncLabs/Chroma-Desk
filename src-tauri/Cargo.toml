[package]
name = "chroma-desk"
version = "0.2.1"
description = "Interfaz para OpenRGB con editor de teclado"
authors = ["neokuze"]
license = "GPL-2.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chroma_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
openrgb2 = { path = "vendor/openrgb2" }
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
notify = "8"
nvml-wrapper = "0.13.0"

# Desktop-notification source (D-Bus monitor): Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

# CPU / RAM readings where /proc and /sys do not exist.
[target.'cfg(not(target_os = "linux"))'.dependencies]
sysinfo = { version = "0.40", default-features = false, features = ["system", "component"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

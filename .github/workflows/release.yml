name: Release

# Builds every package and attaches them to a GitHub Release, plus SHA256SUMS.
#   - push of a tag `v*`             -> builds, then publishes the release
#   - push of a tag `test-v*`, or a manual run (workflow_dispatch) -> builds into a DRAFT release
#     named after the tag, never published (used to test the pipeline)
# Packages are not code-signed (see README: macOS "unidentified developer", Windows SmartScreen).

on:
  push:
    tags: ["v*", "test-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (use a test- prefix, e.g. test-v0.2.0-rc1: the release stays a draft)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the app version
        run: |
          # The tag ends up in a jq filter and in API calls: accept only the expected shape.
          [[ $TAG =~ ^(test-)?v[0-9][A-Za-z0-9._-]*$ ]] || { echo "::error::unexpected tag format: $TAG"; exit 1; }
          ver=$(sed -n 's/^  "version": "\(.*\)",/\1/p' src-tauri/tauri.conf.json | head -1)
          echo "app version: $ver, tag: $TAG"
          case "$TAG" in
            test-*) ;;
            v"$ver") ;;
            *) echo "::error::tag $TAG does not match version $ver in src-tauri/tauri.conf.json"; exit 1 ;;
          esac
      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running reuses the draft; an already published release is never touched.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
                 --jq ".[] | select(.tag_name==\"$TAG\" and .draft) | .id" | head -1)
          if [ -z "$id" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::release $TAG already exists and is published"; exit 1
            fi
            pre=false; case "$TAG" in test-*|*-rc*|*-beta*|*-alpha*) pre=true ;; esac
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
                   -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="chroma-desk $TAG" \
                   -F draft=true -F prerelease="$pre" \
                   -f body="Unsigned builds. See the README for the macOS and Windows first-run warnings. Install with install.sh / install.ps1 or download below; verify with SHA256SUMS." \
                   --jq .id)
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  tauri:
    name: ${{ matrix.name }}
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64 (deb, rpm, AppImage), os: ubuntu-24.04, args: "--bundles deb,rpm,appimage", targets: "" }
          - { name: Linux arm64 (deb, rpm, AppImage), os: ubuntu-24.04-arm, args: "--bundles deb,rpm,appimage", targets: "" }
          - { name: Windows x86_64 (msi, exe), os: windows-latest, args: "--bundles msi,nsis", targets: "" }
          - { name: macOS universal (dmg), os: macos-latest, args: "--target universal-apple-darwin --bundles dmg", targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Linux system packages
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            patchelf file xdg-utils
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          uploadUpdaterJson: false
          args: ${{ matrix.args }}

  arch:
    name: Arch Linux x86_64 (pkg.tar.zst)
    needs: create-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with makepkg in an archlinux container
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/work" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" archlinux:latest bash -euxc '
            pacman -Syu --noconfirm --needed base-devel git sudo
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
            # Build in a copy owned by the unprivileged builder user (makepkg refuses to run as root).
            mkdir -p /home/builder/src
            cp -a /work/. /home/builder/src/
            chown -R builder:builder /home/builder/src
            sudo -u builder bash -euxc "cd /home/builder/src/packaging/arch && makepkg -sf --noconfirm"
            cp /home/builder/src/packaging/arch/chroma-desk-[0-9]*.pkg.tar.zst /work/out/
            chown "$HOST_UID:$HOST_GID" /work/out/*
          '
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-package
          path: out/chroma-desk-[0-9]*.pkg.tar.zst
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.create-release.outputs.release_id }}
        run: |
          for f in out/chroma-desk-[0-9]*.pkg.tar.zst; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=$(basename "$f")" \
              --input "$f" >/dev/null
          done

  checksums:
    name: SHA256SUMS and publish
    needs: [create-release, tauri, arch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Compute SHA256SUMS over every asset
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.create-release.outputs.release_id }}
        run: |
          mkdir assets && cd assets
          gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets?per_page=100" --jq '.[] | select(.name != "SHA256SUMS") | "\(.id) \(.name)"' |
          while read -r id name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "$name"
          done
          ls -l
          sha256sum -- * | tee ../SHA256SUMS
          cd ..
          # Replace a previous SHA256SUMS from an earlier attempt.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets?per_page=100" --jq '.[] | select(.name=="SHA256SUMS") | .id')
          [ -z "$old" ] || gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          gh api --method POST -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RID/assets?name=SHA256SUMS" --input SHA256SUMS >/dev/null
      - name: Publish (v* tag pushes only; test tags and manual runs stay drafts)
        if: github.event_name == 'push' && startsWith(github.ref_name, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ needs.create-release.outputs.release_id }}
        run: gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RID" -F draft=false >/dev/null
